questions:
  - Licensing for App Store - Kyutai weights are CC-BY-NC-SA; commercial distribution needs separate terms. Unresolved, flagged in CONVERSION.md §9.1.

decisions:
  - fp32_softmax_and_ln_not_just_softmax: Initial drift-fix attempt pinned only softmax to fp32 (recovered ~50% of drift). Adding LayerNorm to the fp32 op set closed the remaining gap. Cost was ~25% RTFx drop (10x -> 7.44x realtime on A19 Pro) but audio quality gain is significant and imperceptible RTFx still.
  - post_conversion_mil_pass_not_pytorch_cast: Tried inline PyTorch `scores.float()` cast first - coremltools optimizer fused it away. The post-conversion MIL pass with `FP16ComputePrecision + op_selector` is the only reliable way to pin specific ops to fp32 while keeping weights fp16.
  - ship_fp16_not_palettized: Tested 6-bit palettization on French 24L to reduce 11s iPhone compile cost. Palettization reduced artifact size 2.7x but did NOT reduce compile time or memory pressure (compile still ballooned 167MB -> 1.45GB on device). Reverted to fp16.
  - runtime_layer_resolution: PocketTTSArch.flowLayers is `nonisolated(unsafe) var` set once at PocketTTS.init by reading flow_lm_main input shape. Single-writer-before-reads ordering makes the unsafe mutation safe. 6L variants land at 6, French 24L lands at 24, same Swift code path for both.
  - fresh_voice_handle_per_chunk: PocketTTS.generate mutates the handle's KV cache in place. Demo app TTSViewModel reloads VoiceLoader from disk per chunk rather than caching. ~10ms parse cost is negligible vs generation.
  - 25_token_chunks_in_demo: Conservative vs TextChunker default of 50, left at 25 even after drift fix. With drift fix in place, 40-50 should work; deferred as optional follow-up.
  - sheet_picker_not_menu_for_voice_and_language: Menu/Picker had hit-test flakiness inside custom cards. Replaced with sheet-based List view. Reliable and better UX for 21+ voices.

findings:
  - french_24l_compile_cost_is_graph_not_weight: iPhone 17 Pro takes 11s to compile French flow_lm_main (24L), vs ~1s for 6L languages. Palettization doesn't help because it reduces storage not compile complexity. 2987 ops across 24 layers is the actual cost driver. UX-side mitigation (lazy load, background prewarm) is the right direction when we revisit.
  - french_drift_is_actually_lowest: Counter-intuitive result from verify_french.py - 24L French has the LOWEST per-frame amplitude-drift slope (+0.01%/frame vs +0.5% for some 6L). The deeper LayerNorm chain actually stabilizes fp16 accumulation once softmax+LN are pinned to fp32.
  - portuguese_has_highest_residual_drift: +1.77%/frame vs ~0.3% for other 6L languages. Still passes gates but flag for long-form Portuguese use cases.
  - anemll_profile_dispatch_is_misleading_for_on_device: Mac `-a` profile showed flow_lm_main at 97.9% GPU. Mac ANE rejects the 24L graph entirely (ANECCompile FAILED under `-c`). iPhone A19 Pro ANE is larger and DOES compile successfully, but slowly (11s). Mac ANE behavior does not predict iPhone ANE behavior.
  - streaming_player_completion_race: AVAudioPlayerNode scheduleBuffer completion handlers captured currentChunk at schedule time (all back-to-back, same value). Fix was to capture per-buffer finishIndex = ++scheduledCount in the closure. See StreamingPlayer.swift.
  - tokenizer_must_match_weights_at_runtime: CoreMLGenerator defaulted to language="english" and loaded Spanish mlpackages with English tokenizer -> byte-fallback garbage tokens -> spurious EOS at step 2. Pass language explicitly. iOS app threads this correctly via per-language Resources layout.

worked:
  - Per-submodel fp32 swap experiment (docs/investigations/fp16_drift_localization.md) as a localization tool - pinpointed drift to flow_lm_main in ~1 hour.
  - coremltools FP16ComputePrecision with op_selector for selective fp32 - only reliable way to pin specific ops without fusing.
  - Spanish as template language - all subsequent 6L additions (de/it/pt) were mechanical because the first one established the pattern.
  - verify_<lang>.py sanity scripts - catch language-specific regressions (like the tokenizer mismatch bug) without needing device testing.
  - Sheet-based voice picker over inline Menu - reliably handles 21+ voices in a custom card layout.
  - Explicit schemes block in project.yml to prevent xcodegen from wiping xcshareddata/xcschemes/.

failed:
  - PyTorch-side scores.float() cast for fp32 softmax - fused away by coremltools optimizer.
  - 6-bit palettization on French 24L to reduce compile time - shrank artifacts but not compile work.
  - Cached VoiceHandle in TTSViewModel - mutation poisoned KV for chunks 2+ in streaming mode. Now reload per call.
  - Inline Menu / Picker-menu inside custom card layout - hit-test flakiness.
  - flow_lm_main.mlpackage as AR-only (no text_embeddings input) - forced Python helper workflow until flow_lm_prefill.mlpackage was added.

