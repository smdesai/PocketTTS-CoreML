questions:
  - CC-BY-NC-SA licensing still unresolved for App Store distribution (unchanged from prior sessions; flagged in CONVERSION.md).

decisions:
  - mimi_encoder_cpuonly_hardcoded: PocketTTS.ensureVoiceCloner forces computeUnits=.cpuOnly for the encoder specifically even when the rest of the model runs on .cpuAndNeuralEngine. Encoder has SEANet stride 6/5/4 inverse + depthwise ConvTrUpsample1d which crash the iOS ANE graph splitter. Encoder runs at ~70ms/predict on CPU anyway and is off the hot path (one call per clone).
  - voice_cloner_lazy_not_preloaded: Building the VoiceCloner at PocketTTS.init would add 5-10s to every app startup. Instead build on first cloneVoice call and cache for the session. Cost is paid only by users who clone.
  - safetensors_writer_fix_no_rawvaluepointer: "The use-after-scope bug in SafetensorsWriter was silently producing corrupt headers. Fixed by serializing via `Data(bytes: &localVar, count: ...)` which keeps the variable live during the read. This is a general Swift pattern to avoid."
  - clone_ui_both_paths: Record via AVAudioRecorder AND pick from Files via .fileImporter. User gets the demo-compelling "clone your voice" flow plus the real-world "I have this wav already" flow.

findings:
  - safetensors_writer_was_corrupting_all_clones: The bug had been latent since voice cloning stage 2 landed. It only surfaced reliably on iPhone because the stack-overwrite pattern that clobbered the header-size prefix was more aggressive there. Mac got lucky. Every clone ever written by this code was corrupt; Mac read-back happened to tolerate the garbage header because of how the JSON parse failed.
  - mimi_encoder_and_iphone_ane_splitter_hang: Not a graceful fallback - iOS's ANE program compiler can enter non-terminating states when graph-splitting around unsupported ops. Never use .cpuAndNeuralEngine for a submodel where the majority of ops aren't ANE-supported. Prefer per-model computeUnits over global.
  - ane_program_cache_is_per-app-binary_identity: Spent an hour chasing a phantom "startup went from 3s to 30s" regression. The 3s number was warm-cache; true cold-install startup for 5 mlmodelc bundles on A19 Pro is 60-80s. Every rebuild or reinstall invalidates the cache. Diagnostic move is to close+relaunch app without rebuilding; if that drops to 3s, you're fine.
  - mlmultiarray_has_padded_strides: mimi_encoder output on ANE-aligned hardware has strides [2048, 64, 1] for shape [1, 32, 50] (channel dim padded 50->64 for alignment). Naive dataPointer.bindMemory reads garbage past channel 0. Gather through .strides explicitly. Documented in CONVERSION.md §4.4.
  - withunsafepointer_return_is_undefined: Returning a pointer from a `withUnsafePointer(to:)` closure and using it afterwards is use-after-scope. Stack slot can be reused once the closure returns. Mac may tolerate it; iPhone reliably does not.

worked:
  - Writing phase-timing logs inside VoiceCloner.clone before diagnosing. Made it immediately clear the clone was stuck in MLModel init, not in any predict call.
  - Reproducing the SafetensorsWriter bug on Mac via the CLI (clone alba.wav + Python-parse the output file). The header_size of 6.8 billion immediately told us what was wrong.
  - Having the CLI path available for direct Mac reproduction of voice-clone bugs without involving the iOS app + Xcode loop.

failed:
  - Initial hypothesis that the 3s->30s startup regression was code-related. It was cold-cache, not a regression. Cost an hour of investigation.
  - Trying 6-bit palettization on French as an ANE-compile-time mitigation. It shrinks artifacts (2.7x) but does not reduce compile time or memory pressure. Reverted that change.
  - Attempting to preload mimi_encoder at PocketTTS.init to warm it. Added 5-10s to every app startup for users who never clone. Reverted to lazy.

