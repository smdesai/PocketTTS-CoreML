decisions:
  - mode_tint_rename: Private helper function `tint(for:)` collided with SwiftUI's View.tint instance method -- Swift resolved the instance form first and rejected every call site. Renamed to modeTint(for:). General rule -- don't name helper functions anything SwiftUI View protocol already owns (tint, padding, frame, background, etc).
  - nonisolated_unsafe_for_deinit_access: StopNotificationListener.token is a MainActor-isolated property that deinit needs to read. deinit cannot be MainActor-isolated in Swift 6. Marked nonisolated(unsafe) since token is set exactly once in start() and never mutated again -- single-writer-before-reads makes the unsafe access actually safe. Same pattern used earlier for PocketTTSArch.flowLayers.
  - unchecked_sendable_boxes_for_activitykit: ActivityKit's Activity<> and ActivityContent<> types aren't Sendable (framework predates Swift 6) but are thread-safe in practice (all state lives in the system's Live Activity daemon). Wrapping them in private `struct UnsafeActivityBox -- @unchecked Sendable { let value }` lets them cross Task boundaries without tripping sendability checks. This is the standard Swift 6 workaround for unaudited Apple framework types.
  - darwin_notification_for_stop_intent: App Intent's perform() runs in the widget extension process, separate from the app. To deliver a Stop signal to the running app, post a CFNotificationCenter Darwin notification (cross-process) that the app observes at TTSViewModel init. Avoids shared UserDefaults + polling; delivery is immediate.

findings:
  - background_audio_works_as_wired: AVAudioSession .playback + .spokenAudio category with UIBackgroundModes -- audio in Info.plist handles all the cases that matter -- swipe home during play, lock screen during stream, chunk transitions while backgrounded. No code changes needed; the infrastructure set up earlier was already correct.
  - app_intent_static_property_rule_swift6: LiveActivityIntent conformances need title and description as `static let`, not `static var`. Swift 6 rejects mutable static state for concurrency reasons. Apple's sample code in the AppIntents docs still shows `static var` in places; ignore that and use `let`.
  - cfnotificationcenter_addobserver_takes_cfstring_not_cfnotificationname: The API's parameter type is misleadingly named but accepts a raw CFString. Post side (CFNotificationCenterPostNotification) does take a CFNotificationName wrapper. Subtle asymmetry; got it wrong on first pass.
  - task_at_mainactor_in_doesnt_bypass_sendable: Wrapping `Task { @MainActor in ... }` around a capture doesn't silence Swift 6's Sendable check for the captured values, even though conceptually the Task runs on the same actor as the caller. Must wrap the non-Sendable value in an @unchecked Sendable struct or use Task.detached with the box pattern.
  - dynamic_island_compact_trailing_short_labels: Best UX in the compact trailing slot is a 3-5 char label (e.g. "1/3", "2.1s", "..."). More gets truncated with an ellipsis. The expanded view is the right place for anything longer.

worked:
  - Defining ActivityAttributes + ContentState once in a Shared/ folder and including it in both the app and widget extension targets via xcodegen. No module-boundary imports needed; both targets compile the file identically.
  - Using Darwin notifications for cross-process Stop signaling. Immediate, no polling, no UserDefaults key churn.
  - "@unchecked Sendable struct boxes for ActivityKit types as a clean Swift 6 workaround rather than disabling strict concurrency globally."
  - xcodegen's app-extension.widgetkit-extension target type -- auto-wires the extension as an embedded bundle of the main app, no manual Xcode steps needed.

failed:
  - First attempt wrapped `Task { @MainActor in await activity.update(content) }` hoping @MainActor annotation would count as same-isolation. Swift 6 still flagged `activity` and `content` as non-Sendable sends. Had to add @unchecked Sendable boxes.
  - Kraken's initial Live Activity code used `CFNotificationName(name)` on both post and observe sides; only the post side is correct. Observe side takes a raw CFString.
  - One unused `let compiled` variable lingered from the CoreML path; trivial warning, untouched in this cycle.

