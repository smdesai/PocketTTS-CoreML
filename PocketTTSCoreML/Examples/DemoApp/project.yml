name: DemoApp
options:
  bundleIdPrefix: com.sdesai.pockettts.demo
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Automatic code signing — the user picks their team in Xcode. No team
    # id is hard-coded so this project stays machine-independent.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  PocketTTSCoreML:
    # Consume the SwiftPM package two levels up.
    path: ../..

targets:
  DemoApp:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: DemoApp
        excludes:
          - "Info.plist"         # declared via info.path
      # Shared ActivityAttributes + StopPocketTTSIntent — compiled into
      # both the app target (to start/update Live Activities + observe
      # the Stop Darwin notification) and the widget extension target
      # (to render views + declare the App Intent).
      - path: Shared
      # NOTE: Model artifacts + voices + tokenizers are NOT bundled.
      # ModelDownloader.swift downloads them from Hugging Face on first
      # use into Application Support/pocket-tts-coreml/<configName>/.
      # This keeps the .ipa small (no 4+ GB of CoreML weights).
    dependencies:
      - package: PocketTTSCoreML
        product: PocketTTSCoreML
      # Embed the Live Activity widget extension inside the app bundle.
      - target: PocketTTSLiveActivity
    info:
      path: DemoApp/Info.plist
      properties:
        CFBundleDisplayName: PocketTTS Demo
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
        # ActivityKit: declare Live Activity support. Required on iOS 16.1+
        # for Activity.request() to succeed.
        NSSupportsLiveActivities: true
        # Microphone usage: required for the voice-cloning flow in
        # CloneSheet.swift. The user can either record a ~4s reference
        # clip or pick an existing audio file; the record path prompts
        # for mic permission via AVCaptureDevice.requestAccess.
        NSMicrophoneUsageDescription: "PocketTTS Demo needs microphone access to clone your voice."
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIViewControllerBasedStatusBarAppearance: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sdesai.pockettts.demo.DemoApp
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: "YES"
        SWIFT_VERSION: "6.0"

  PocketTTSLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PocketTTSLiveActivity
        excludes:
          - "Info.plist"
      # Share the ActivityAttributes + StopPocketTTSIntent with the app.
      - path: Shared
    info:
      path: PocketTTSLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: PocketTTS Live Activity
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sdesai.pockettts.demo.DemoApp.LiveActivity
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        ENABLE_PREVIEWS: "YES"
        # Extensions do not themselves declare background modes; the
        # app host does. No Info.plist background keys here.

# Declare the scheme explicitly so `xcodegen generate` re-creates
# xcshareddata/xcschemes/DemoApp.xcscheme instead of wiping the
# directory. Without this block, xcodegen silently deletes the
# scheme file whenever it regenerates the project (observed
# 2026-05-02 during language-picker work).
schemes:
  DemoApp:
    build:
      parallelizeBuild: true
      buildImplicitDependencies: true
      targets:
        DemoApp: all
        PocketTTSLiveActivity: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
